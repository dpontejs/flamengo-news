[project]
name = "flanews"
version = "0.1.0"
description = "Newsletter com notícias e estatísticas do Flamengo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser",
    "google-genai",
    "httpx",
    "jinja2",
    "premailer",
    "pydantic",
    "pydantic-settings",
    "python-dateutil",
    "rapidfuzz",
    "selectolax",
    "tenacity",
    "trafilatura",
    "typer",
]

[dependency-groups]
dev = [
    "freezegun",
    "pytest",
    "respx",
    "ruff",
]

[project.scripts]
flanews = "flanews.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
